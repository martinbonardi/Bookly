<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Bookly agent flow</title>
  <desc id="desc">Flow from customer interface through session state, intent routing, tools, grounded response and history.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#24664f"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#17352b" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1400" height="760" fill="#f7f8f4"/>
  <text x="70" y="70" font-family="Arial, sans-serif" font-size="18" letter-spacing="4" fill="#24664f">BOOKLY · AGENT FLOW</text>
  <text x="70" y="120" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#172a23">From customer intent to grounded action</text>
  <g font-family="Arial, sans-serif" fill="#172a23" filter="url(#shadow)">
    <rect x="70" y="220" width="210" height="110" rx="22" fill="#e2f0e8" stroke="#b7d5c5" stroke-width="2"/>
    <text x="175" y="263" text-anchor="middle" font-size="17" fill="#24664f">SURFACE</text>
    <text x="175" y="294" text-anchor="middle" font-size="23" font-weight="700">/ · /landing</text>
    <rect x="350" y="220" width="210" height="110" rx="22" fill="#ffffff" stroke="#c7d6ce" stroke-width="2"/>
    <text x="455" y="263" text-anchor="middle" font-size="17" fill="#24664f">SESSION</text>
    <text x="455" y="294" text-anchor="middle" font-size="22" font-weight="700">language · cart</text>
    <rect x="630" y="205" width="250" height="140" rx="24" fill="#24664f"/>
    <text x="755" y="254" text-anchor="middle" font-size="17" fill="#bce5d1">ORCHESTRATOR</text>
    <text x="755" y="291" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">intent + missing data</text>
    <rect x="950" y="180" width="300" height="190" rx="24" fill="#ffffff" stroke="#c7d6ce" stroke-width="2"/>
    <text x="1100" y="225" text-anchor="middle" font-size="17" fill="#24664f">TOOLS / ACTIONS</text>
    <text x="1100" y="260" text-anchor="middle" font-size="21">search_books</text>
    <text x="1100" y="293" text-anchor="middle" font-size="21">order · return · checkout</text>
    <text x="1100" y="326" text-anchor="middle" font-size="18" fill="#687970">ground truth</text>
    <rect x="480" y="500" width="300" height="120" rx="24" fill="#f0e6cf" stroke="#dbc99e" stroke-width="2"/>
    <text x="630" y="545" text-anchor="middle" font-size="17" fill="#7a6030">OPTIONAL COGNITIVE LAYER</text>
    <text x="630" y="582" text-anchor="middle" font-size="23" font-weight="700">OpenAI adapter</text>
    <rect x="890" y="500" width="360" height="120" rx="24" fill="#e2f0e8" stroke="#b7d5c5" stroke-width="2"/>
    <text x="1070" y="545" text-anchor="middle" font-size="17" fill="#24664f">OUTPUT</text>
    <text x="1070" y="582" text-anchor="middle" font-size="23" font-weight="700">reply · trace · history</text>
  </g>
  <g stroke="#24664f" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M280 275 H350"/>
    <path d="M560 275 H630"/>
    <path d="M880 275 H950"/>
    <path d="M1100 370 V500"/>
    <path d="M890 560 H780"/>
    <path d="M480 560 H280 V330"/>
  </g>
  <path d="M755 345 V500" stroke="#b89a55" stroke-width="3" stroke-dasharray="9 9" marker-end="url(#arrow)"/>
  <text x="70" y="700" font-family="Arial, sans-serif" font-size="18" fill="#687970">Operational answers stay grounded in tools; OpenAI supports classification and wording when configured.</text>
</svg>
